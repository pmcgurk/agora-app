# Render Blueprint for a real Agora site. Full walkthrough: docs/deploy-render.md.
# (The public demo has its own blueprint, render.demo.yaml.)
#
# Render asks for every value marked `sync: false` when you apply the blueprint. Plan names and
# prices change, so check them on Render's pricing page before you apply. Pick a database plan
# that keeps your data (not a time-limited free one) and a web plan that stays awake.
databases:
  - name: agora-db
    databaseName: agora
    user: agora
    plan: basic-256mb

services:
  - type: web
    name: agora
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: agora-db
          property: connectionString

      # The address people use, with https:// and no trailing slash, for example
      # https://blog.example.com. Links, emails and the session cookie depend on it.
      - key: NEXT_PUBLIC_BASE_URL
        sync: false

      # S3-compatible storage for pictures and files (Cloudflare R2, Backblaze B2, AWS S3...). The
      # variable names say MINIO because Agora also runs against MinIO; they mean "S3 endpoint,
      # bucket, access key and secret" for any provider.
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PUBLIC_ENDPOINT
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
      - key: MINIO_REGION
        value: auto
      # Largest single upload, in MB.
      - key: MAX_UPLOAD_MB
        value: "1024"

      # Without Stripe keys this must stay false, or anyone could "buy" a paid tier for free.
      - key: ALLOW_FREE_SUBSCRIPTIONS
        value: "false"

      # Render makes a random value for this. Setup (/setup) asks for it, so nobody else can claim your
      # site before you do. Read it under the service's Environment tab.
      - key: SETUP_TOKEN
        generateValue: true

      # Render makes a random value for this too. It encrypts the Stripe keys and SMTP password you save in
      # Settings. Do not change or delete it afterwards, or saved keys must be entered again.
      - key: APP_SECRET
        generateValue: true

      # Optional, set in the Render dashboard if you prefer configuration as code. The site owner can
      # also enter all of these inside Agora (Settings > Payments and Settings > Email):
      #   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
      #   MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASSWORD, MAIL_FROM, MAIL_SECURE
