# Pull requests for out-of-date or vulnerable dependencies, grouped so they stay reviewable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (used by eslint-config-next) only supports TypeScript up to 6.0, and ESLint crashes
      # on 7. Remove this once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
