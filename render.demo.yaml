# Render Blueprint for the PUBLIC DEMO (https://agora.mcgurk.dev), not for a real site: it sets
# DEMO_MODE, which wipes the database on every start. A real site uses render.yaml instead.
# Walkthrough: docs/deploy-render.md, "The public demo". Render prompts for every value marked
# `sync: false` when you apply the blueprint. Check plan names and prices on Render's pricing page.
databases:
  - name: agora-demo-db
    databaseName: agora
    user: agora
    plan: free

services:
  - type: web
    name: agora-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Demo mode: fictional creator, replayable wizard, hourly reset. Never set on a real site.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_RESET_MINUTES
        value: "60"
      - key: WAITLIST_EMAIL
        value: paul@mcgurk.dev

      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: agora-demo-db
          property: connectionString
      - key: NEXT_PUBLIC_BASE_URL
        value: https://agora.mcgurk.dev

      # S3-compatible storage (Cloudflare R2, Backblaze B2, AWS S3...). The variable names say MINIO
      # because Agora also runs against MinIO; any S3-compatible service works.
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PUBLIC_ENDPOINT
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
      - key: MINIO_REGION
        value: auto

      # Outgoing email, used to tell you about waitlist sign-ups.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
